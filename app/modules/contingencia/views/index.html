{% extends template('adminlte') %}

{% block js %}
<script src="{{ BASE_URL }}/public/plugins/bs-custom-file-input/bs-custom-file-input.min.js"></script>
<script src="{{ public_file('index.js') }}"></script>
{% endblock %}

{% block content %}
<div class="p-3">
    <div class="card card-primary card-outline">
        <div class="card-header">
            <div class="d-flex justify-content-between">
                <div class="card-title">Pagos de contingencia</div>
                <div class="text-right">
                    {% if es_de_contingencia %}
                    <button class="btn btn-sm btn-primary" id="btn-cargar-contingencia">
                        <i class="fas fa-upload mr-1"></i> Cargar contingencia
                    </button>
                    {% endif %}
                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-sm table-bordered table-striped table-hover w-100 mb-0" id="table-contingencias">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>N° Referencia</th>
                            <th>N° lote</th>
                            <th>Nombre emisor</th>
                            <th>Descargas</th>
                            <th>Opc.</th>
                        </tr>
                    </thead>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- MODAL CARGAR CONTINGENCIA -->
<div class="modal fade" id="modal-cargar-contingencia">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <form class="modal-content" enctype="multipart/form-data">
            <div class="modal-header bg-primary">
                <h5 class="mb-0">Cargar contingencia</h5>
                <button class="close" type="button" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-12">
                        <div class="form-group">
                            <label class="mb-1">Archivo</label>
                            <div class="custom-file">
                                <input type="file" class="custom-file-input" required id="archivo" name="archivo">
                                <label class="custom-file-label" for="archivo">Seleccione el archivo...</label>
                            </div>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="form-group">
                            <label class="mb-1">Nombre emisor</label>
                            <input type="text" class="form-control" name="nombre_emisor" required placeholder="Nombre emisor...">
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="form-group mb-0">
                            <label class="mb-1">N° de lote</label>
                            <input type="number" min="0" step="1" class="form-control" name="numero_lote" required placeholder="N° de lote...">
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="form-group mb-0">
                            <label class="mb-1">Referencia inicial</label>
                            <input type="number" min="0" step="1" class="form-control" name="referencia_inicial" required placeholder="Referencia inicial...">
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline-secondary" style="width: 100px;" type="button" data-dismiss="modal">
                    Cerrar
                </button>
                <button class="btn btn-primary" style="width: 100px;" type="submit">
                    Cargar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
