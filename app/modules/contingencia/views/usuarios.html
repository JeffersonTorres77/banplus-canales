{% extends template('adminlte') %}

{% block js %}
<script src="{{ public_file('usuarios.js') }}"></script>
{% endblock %}

{% block content %}
<div class="p-3">
    <div class="card card-success card-outline">
        <div class="card-header">
            <div class="d-flex justify-content-between align-items-center">
                <div class="card-title">Usuarios de contingencia</div>
                <div>
                    <button class="btn btn-sm btn-primary" data-toggle="modal" data-target="#modal-registrar">
                        <i class="fas fa-user-plus mr-1"></i> Nuevo usuario
                    </button>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-sm table-bordered table-hover table-striped w-100 mb-0" id="table-usuarios">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>N° Lote</th>
                            <th>Ref. Inicial</th>
                            <th>Opc.</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="100">
                                <h5 class="text-center mb-0 p-3">. . .</h5>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- MODAL REGISTRAR -->
<div class="modal fade" id="modal-registrar">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <form class="modal-content">
            <div class="modal-header bg-primary">
                <h5 class="mb-0">Registrar usuario de contingencia</h5>
            </div>

            <div class="modal-body">
                {% for usuario in usuarios_no_registrados %}
                {{ usuario.usuario }}<br>
                {% endfor %}
            </div>

            <div class="modal-footer">
                <button class="btn btn-outline-secondary" data-dismiss="modal" type="button" style="width: 100px;">
                    Cerrar
                </button>
                <button class="btn btn-primary" type="submit" style="width: 100px;">
                    Registrar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
