{% extends template('adminlte') %}

{% block js %}
<script src="{{ public_file('index.js') }}"></script>
{% endblock %}

{% block content %}
<section class="p-3">
    <div class="card card-primary card-outline">
        <div class="card-header">
            <div class="card-title">
                Roles
            </div>
        </div>
        
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-sm mb-0 table-hover table-bordered w-100" id="table-roles">
                    <thead class="table-primary">
                        <tr>
                            <th>Nombre</th>
                            <th>Opc.</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td class="text-center" colspan="100">
                                <h5 class="mb-0 p-3">. . .</h5>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<!-- MODAL VER -->
<div class="modal fade" id="modal-ver">
    <div class="modal-dialog modal-dialog-centered modal-scrollable">
        <div class="modal-content">
            <div class="modal-header bg-primary">
                <div class="modal-title h5">Ver Rol</div>
                <button class="close" data-dismiss="modal" type="button">&times;</button>
            </div>

            <div class="modal-body">

            </div>

            <div class="modal-footer justify-content-center">
                <button class="btn btn-outline-secondary" style="width: 100px;" type="button" data-dismiss="modal">
                    Cerrar
                </button>
            </div>
        </div>
    </div>
</div>

<!-- MODAL EDITAR -->
<div class="modal fade" id="modal-editar">
    <div class="modal-dialog modal-dialog-centered modal-scrollable">
        <form class="modal-content">
            <div class="modal-header bg-success">
                <div class="modal-title h5">Modificar Rol</div>
                <button class="close" data-dismiss="modal" type="button">&times;</button>
            </div>

            <div class="modal-body">

            </div>

            <div class="modal-footer justify-content-center">
                <button class="btn btn-outline-secondary" style="width: 100px;" type="button" data-dismiss="modal">
                    Cerrar
                </button>

                <button class="btn btn-success" style="width: 100px;" type="submit">
                    Guardar
                </button>
            </div>
        </form>
    </div>
</div>

<!-- MODAL ELIMINAR -->
<div class="modal fade" id="modal-eliminar">
    <div class="modal-dialog modal-dialog-centered modal-scrollable">
        <form class="modal-content">
            <div class="modal-header bg-danger">
                <div class="modal-title h5">Eliminar Rol</div>
                <button class="close" data-dismiss="modal" type="button">&times;</button>
            </div>

            <div class="modal-body">

            </div>

            <div class="modal-footer justify-content-center">
                <button class="btn btn-outline-secondary" style="width: 100px;" type="button" data-dismiss="modal">
                    Cerrar
                </button>

                <button class="btn btn-danger" style="width: 100px;" type="submit">
                    Eliminar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
